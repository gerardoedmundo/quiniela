<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quiniela Final Liga MX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;padding:30px;color:white;}
.container{max-width:1100px;margin:auto;}
.header{text-align:center;margin-bottom:30px;}
.header h1{font-size:3rem;font-weight:700;margin-bottom:10px;}
.header p{color:#cbd5e1;font-size:1rem;}
.card{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px);border-radius:25px;padding:25px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,0.3);}
.section-title{font-size:1.5rem;margin-bottom:20px;font-weight:600;color:#f8fafc;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.input-group{display:flex;flex-direction:column;}
.input-group label{margin-bottom:8px;font-weight:500;color:#e2e8f0;}
.input-group input,.input-group select{padding:12px;border:none;border-radius:12px;background:#f8fafc;color:#0f172a;font-size:1rem;}
.points table{width:100%;border-collapse:collapse;border-radius:15px;overflow:hidden;}
.points th{background:#2563eb;padding:15px;}
.points td{padding:15px;background:rgba(255,255,255,0.05);text-align:center;border-bottom:1px solid rgba(255,255,255,0.08);}
.submit-btn{width:100%;padding:18px;border:none;border-radius:18px;background:linear-gradient(90deg,#2563eb,#06b6d4);color:white;font-size:1.1rem;font-weight:600;cursor:pointer;margin-top:10px;}
.footer{text-align:center;margin-top:25px;color:#cbd5e1;font-size:0.9rem;}
.badge{display:inline-block;padding:8px 16px;background:#22c55e;border-radius:999px;font-size:0.9rem;margin-top:10px;}
.deadline{background:#ef4444;padding:10px;border-radius:12px;text-align:center;margin-bottom:15px;}
.score-box{display:inline-block;width:50px;height:25px;border:2px solid white;border-radius:6px;margin-left:10px;}
.notice{background:#22c55e;padding:10px;border-radius:12px;text-align:center;margin-bottom:15px;}
</style>
</head>

<body>
<div class="container" id="contenido">

<div class="header">
<h1>🏆 Quiniela Final Liga MX</h1>
<p>Pumas vs Cruz Azul • Ida y Vuelta</p>
<div class="badge">13 Participantes</div>
</div>

<div class="deadline" id="deadlineMsg"></div>
<div class="notice">📌 1. Descarga tu PDF → 2. Envíalo por WhatsApp</div>

<div class="card">
<h2 class="section-title">👤 Datos del Jugador</h2>
<input type="text" id="nombre" placeholder="Nombre del jugador">
</div>

<div class="card">
<h2 class="section-title">🏅 Marcador Global <span class="score-box"></span></h2>
<div class="grid">
<input type="number" id="global_pumas" placeholder="Pumas">
<input type="number" id="global_cruz" placeholder="Cruz Azul">
</div>
</div>

<div class="card">
<h2 class="section-title">🎯 Preguntas Especiales</h2>

<label>Campeón</label>
<select id="campeon"><option>Pumas</option><option>Cruz Azul</option></select>

<label>Primer gol</label>
<select id="primerGol"><option>Pumas</option><option>Cruz Azul</option><option>No hay gol</option></select>

<label>Rango gol</label>
<select id="rangoGol"><option>1-30</option><option>31-60</option><option>61-90</option><option>91-120</option></select>

<label>Roja</label>
<select id="roja"><option>Sí</option><option>No</option></select>

<label>Penal</label>
<select id="penal"><option>Sí</option><option>No</option></select>

<label>Extra</label>
<select id="extra"><option>Sí</option><option>No</option></select>

<label>Penales</label>
<select id="penales"><option>Sí</option><option>No</option></select>

<label>Autogol</label>
<select id="autogol"><option>Sí</option><option>No</option></select>

<label>Minuto</label>
<input type="number" id="minuto">

</div>

<button class="submit-btn" onclick="generarPDF(event)">📄 Descargar PDF</button>
<button class="submit-btn" onclick="enviarWhatsApp(event)">📲 Enviar por WhatsApp</button>

</div>

<script>
const fechaLimite = new Date("2026-05-21T17:00:00");

function generarFolio(){return "Q-"+Math.floor(100000+Math.random()*900000)}

function verificar(){
const msg=document.getElementById("deadlineMsg");
msg.innerText=new Date()>fechaLimite ? "⛔ Cerrado" : "⏳ Fecha límite: 21 mayo 17:00";
}

async function generarPDF(e){
e.preventDefault();
if(new Date()>fechaLimite)return alert("Cerrado");

let folio = generarFolio();
let header = document.querySelector(".header");
let f = document.createElement("p");
f.innerText="Folio: "+folio;
header.appendChild(f);

// modo blanco y negro
document.body.style.background="#fff";
document.body.style.color="#000";

document.querySelectorAll(".card").forEach(c=>{
c.style.background="#fff";
c.style.color="#000";
c.style.border="1px solid #000";
});

// captura
const canvas = await html2canvas(document.getElementById("contenido"),{scale:2});
const img = canvas.toDataURL("image/png");

const {jsPDF}=window.jspdf;
const pdf=new jsPDF();

let w=pdf.internal.pageSize.getWidth();
let h=(canvas.height*w)/canvas.width;

let heightLeft=h;
let pos=0;

pdf.addImage(img,'PNG',0,pos,w,h);
heightLeft-=pdf.internal.pageSize.getHeight();

while(heightLeft>0){
pos=heightLeft-h;
pdf.addPage();
pdf.addImage(img,'PNG',0,pos,w,h);
heightLeft-=pdf.internal.pageSize.getHeight();
}

pdf.save("quiniela.pdf");

// restaurar
location.reload();
}

function enviarWhatsApp(e){
e.preventDefault();
window.open("https://wa.me/?text=Ya llené mi quiniela y adjunto el PDF");
}

verificar();
</script>

</body>
</html>
