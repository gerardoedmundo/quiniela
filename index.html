<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela PRO Liga MX</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#d4af37,#f5d76e,#c9a227);
padding:20px;
}

.container{max-width:900px;margin:auto;}

.card{
background:#fff;
border-radius:15px;
padding:15px;
margin-bottom:15px;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#b8962e;
cursor:pointer;
margin-top:5px;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
border-radius:10px;
border:1px solid #ccc;
}

.grid{
display:grid;
grid-template-columns:1fr auto 1fr;
gap:10px;
align-items:center;
}

@media(max-width:768px){
.grid{grid-template-columns:1fr;}
}

.ranking-item{
display:flex;
justify-content:space-between;
padding:8px;
border-bottom:1px solid #ddd;
}
</style>
</head>

<body>

<div class="container">

<div class="card">
<h2>👤 Jugadores</h2>

<div style="display:flex; gap:10px;">
<input type="text" id="nuevoAlumno" placeholder="Nombre">
<button onclick="agregarAlumno()">➕</button>
</div>

<select id="listaAlumnos"></select>
</div>

<div class="card">
<h2>🏅 Marcador</h2>
<div class="grid">
<input type="number" id="pumas">
<div>VS</div>
<input type="number" id="cruzazul">
</div>
</div>

<div class="card">
<h2>🎯 Campeón</h2>
<select id="campeon">
<option>Pumas</option>
<option>Cruz Azul</option>
</select>
</div>

<button onclick="guardarQuiniela()">💾 Guardar Quiniela</button>
<button onclick="verRanking()">🏆 Ver Ranking</button>

<div class="card">
<h2>📊 Ranking</h2>
<div id="ranking"></div>
</div>

</div>

<script>

// =====================
// CARGAR AL INICIAR
// =====================
window.onload = function(){
cargarAlumnos();
};

// =====================
// AGREGAR ALUMNO
// =====================
function agregarAlumno(){
const nombre = document.getElementById("nuevoAlumno").value.trim();
if(nombre==="") return alert("Escribe un nombre");

let alumnos = JSON.parse(localStorage.getItem("alumnos")) || [];

if(alumnos.includes(nombre)){
alert("Ya existe");
return;
}

alumnos.push(nombre);
localStorage.setItem("alumnos", JSON.stringify(alumnos));

document.getElementById("nuevoAlumno").value="";
cargarAlumnos();
}

// =====================
// CARGAR ALUMNOS
// =====================
function cargarAlumnos(){
const select = document.getElementById("listaAlumnos");
select.innerHTML = "";

let alumnos = JSON.parse(localStorage.getItem("alumnos")) || [];

alumnos.forEach(nombre=>{
let option = document.createElement("option");
option.text = nombre;
select.add(option);
});
}

// =====================
// GUARDAR QUINIELA
// =====================
function guardarQuiniela(){
const nombre = document.getElementById("listaAlumnos").value;
if(nombre==="") return alert("Selecciona jugador");

const data = {
pumas: document.getElementById("pumas").value,
cruzazul: document.getElementById("cruzazul").value,
campeon: document.getElementById("campeon").value,
puntos: Math.floor(Math.random()*20) // simulado
};

let quinielas = JSON.parse(localStorage.getItem("quinielas")) || {};

quinielas[nombre] = data;

localStorage.setItem("quinielas", JSON.stringify(quinielas));

alert("Quiniela guardada");
}

// =====================
// RANKING
// =====================
function verRanking(){
let quinielas = JSON.parse(localStorage.getItem("quinielas")) || {};

let lista = [];

for(let nombre in quinielas){
lista.push({nombre, puntos: quinielas[nombre].puntos});
}

lista.sort((a,b)=>b.puntos-a.puntos);

const contenedor = document.getElementById("ranking");
contenedor.innerHTML = "";

lista.forEach((jugador,i)=>{
contenedor.innerHTML += `
<div class="ranking-item">
<span>${i+1}. ${jugador.nombre}</span>
<strong>${jugador.puntos} pts</strong>
</div>
`;
});
}

</script>

</body>
</html>
